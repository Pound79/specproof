name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  # Installs, tests and packs. This is the only job that runs the project's and
  # its dependencies' code (`npm ci` install scripts, tests, tsc, prepack), so
  # it gets no `id-token: write` and can never mint an npm publish credential.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Must run before any publish step: npm publish can't be undone, so a
      # tag/package-version mismatch (e.g. a manual `v0.3.1` push while
      # cli/package.json still says the unpublished `0.3.0`) has to fail
      # here, not after 0.3.0 is already on the registry.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./cli/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::pushed tag $GITHUB_REF_NAME does not match cli/package.json version v$PKG_VERSION — refusing to publish"
            exit 1
          fi
      # No dependency cache: the tarballs packed here are exactly what gets
      # published, so install from the lockfile without restoring a shared
      # Actions cache. `package-manager-cache: false` keeps setup-node from
      # enabling the cache on its own if package.json gains `packageManager`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # Publish gate: never ship when the npm packages and the Claude Code plugin
      # manifests disagree on version. scripts/release.sh keeps them in lockstep,
      # but a manual/out-of-script `v*` tag push reaches this workflow directly —
      # this check stops it from publishing a drifted state (the bug #13 fixes).
      - run: npm run check:versions
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # `npm pack` runs the packages' prepack/prepare scripts here, so the
      # publish job can upload the finished tarballs without running them.
      # npm pack does not create --pack-destination, so make it first.
      - run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          npm pack --workspace packages/traceability --workspace cli --pack-destination "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1
  # Publishes the tarballs built above. It holds `id-token: write` for npm
  # trusted publishing (OIDC) + provenance, so it runs no dependency code: no
  # `npm ci`, no `npm run`, and publishing a tarball runs no lifecycle scripts.
  # The only scripts it runs are scripts/verify-publish-tarball.sh and
  # verify-publish-manifest.mjs from the same commit as this workflow (the
  # latter loads the runner's npm-bundled pacote, not project dependencies). Same reasoning as keeping `contents: write` in the
  # `release` job.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) + provenance
    env:
      # One npm cache for the verify script and `npm publish`, so the tarball is
      # extracted in the same place by both (npm's prepare looks for `.git`
      # upward from there).
      npm_config_cache: ${{ runner.temp }}/npm-cache
    steps:
      # Checked out to read the package versions and the verify script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
      # The publish steps run npm in this directory. With no package.json above
      # it, npm loads a `.npmrc` here as project config (proxy, TLS, registry),
      # so the build job must not be able to add anything but the two tarballs.
      - name: Verify the downloaded artifact
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          TRACEABILITY_VERSION=$(node -p "require(process.env.GITHUB_WORKSPACE + '/packages/traceability/package.json').version")
          CLI_VERSION=$(node -p "require(process.env.GITHUB_WORKSPACE + '/cli/package.json').version")
          EXPECTED=$(printf '%s\n' "pound79-specproof-$CLI_VERSION.tgz" "pound79-specproof-traceability-$TRACEABILITY_VERSION.tgz" | sort)
          ACTUAL=$(ls -A | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::the artifact must hold exactly the two expected tarballs, found: ${ACTUAL//$'\n'/ } — refusing to publish"
            exit 1
          fi
      # Authentication is npm trusted publishing: npm exchanges this job's OIDC
      # token for a short-lived publish credential. Each package must list this
      # repository and `release.yml` as a trusted publisher on npmjs.com, with
      # `npm publish` allowed. No npm token secret is used. The steps run in the
      # tarball directory, outside the npm workspace root. npm applies a
      # tarball's `publishConfig` as npm config for the publish and its OIDC
      # exchange, and `--registry` does not override other keys such as
      # `https-proxy`, `strict-ssl` or `@pound79:registry`; the real control is
      # scripts/verify-publish-tarball.sh, which reads the tarball with this
      # npm's own pacote and cache (as `npm publish <tarball>` does) and refuses
      # it unless the package.json npm would read is byte-identical to the
      # checked-out one, the tarball has no `.git` for npm to fill gitHead from,
      # and npm's manifest adds or changes no field beyond the few it derives
      # (so no install script from binding.gyp, contributors from AUTHORS, ...).
      - name: Publish @pound79/specproof-traceability
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          PKG_VERSION=$(node -p "require(process.env.GITHUB_WORKSPACE + '/packages/traceability/package.json').version")
          NPM_TAG=latest
          case "$PKG_VERSION" in *-*) NPM_TAG=next ;; esac
          bash "$GITHUB_WORKSPACE/scripts/verify-publish-tarball.sh" "./pound79-specproof-traceability-$PKG_VERSION.tgz" "$GITHUB_WORKSPACE/packages/traceability/package.json"
          if npm view @pound79/specproof-traceability@"$PKG_VERSION" version 2>/dev/null; then
            echo "::notice::@pound79/specproof-traceability@$PKG_VERSION already published — skipping"
          else
            npm publish "./pound79-specproof-traceability-$PKG_VERSION.tgz" --registry https://registry.npmjs.org --provenance --tag "$NPM_TAG"
          fi
      - name: Publish @pound79/specproof
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          PKG_VERSION=$(node -p "require(process.env.GITHUB_WORKSPACE + '/cli/package.json').version")
          NPM_TAG=latest
          case "$PKG_VERSION" in *-*) NPM_TAG=next ;; esac
          bash "$GITHUB_WORKSPACE/scripts/verify-publish-tarball.sh" "./pound79-specproof-$PKG_VERSION.tgz" "$GITHUB_WORKSPACE/cli/package.json"
          if npm view @pound79/specproof@"$PKG_VERSION" version 2>/dev/null; then
            echo "::notice::@pound79/specproof@$PKG_VERSION already published — skipping"
          else
            npm publish "./pound79-specproof-$PKG_VERSION.tgz" --registry https://registry.npmjs.org --provenance --tag "$NPM_TAG"
          fi
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release — kept out of the `publish`
                         # job so this token never coexists with `npm ci` /
                         # `npm test` / `npm run build` running third-party
                         # dependency code (see CHANGELOG / PR history).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # gh authenticates via GH_TOKEN below, not git
      - name: Create GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          PKG_VERSION=$(node -p "require('./cli/package.json').version")
          TAG="$GITHUB_REF_NAME"
          # Belt-and-suspenders: `build` already refuses to run past this same
          # check, and `publish` needs `build`, so this is unreachable via the
          # normal path — kept in case this job is ever triggered independently.
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::pushed tag $TAG does not match cli/package.json version v$PKG_VERSION — refusing to create a mismatched GitHub Release"
            exit 1
          fi
          EXTRA_ARGS=()
          case "$PKG_VERSION" in
            *-*) EXTRA_ARGS+=(--prerelease) ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping"
          elif node scripts/changelog-section.mjs "$PKG_VERSION" > "$RUNNER_TEMP/release-notes.md" 2>/dev/null; then
            gh release create "$TAG" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${EXTRA_ARGS[@]}"
          else
            echo "::warning::no CHANGELOG.md section for $PKG_VERSION — falling back to --generate-notes"
            gh release create "$TAG" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${EXTRA_ARGS[@]}"
          fi
