name: Dependency Review

# Fails a PR only for vulnerable dependencies that the PR itself adds or
# upgrades into (diff of the dependency graph between base and head).
# Vulnerabilities already on main are tracked by Dependabot alerts and fixed
# by Dependabot security updates, so unrelated PRs are not blocked by them.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Dev dependencies run in CI and on contributors' machines, so they count too.
          fail-on-scopes: runtime, development, unknown
          show-patched-versions: true
