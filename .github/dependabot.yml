version: 2
# Every entry waits 7 days (Dependabot's default is 3) after a release before
# proposing it (`cooldown`), so a hijacked version that is caught and
# unpublished within days never reaches a PR. Cooldown applies to version
# updates only — Dependabot security updates still open PRs as soon as a fix
# exists.
updates:
  # Root npm workspace — the single root package-lock.json covers
  # `cli` and `packages/*`, so this one entry keeps the whole workspace current.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Batch all minor/patch bumps into one PR to cut review noise.
      # Major bumps stay as individual PRs so breaking changes get human review.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Scaffold template shipped into user projects. It lives outside the
  # workspace and has no lockfile, so Dependabot bumps the package.json
  # ranges directly. Keeps generated projects on recent deps. The cooldown
  # only delays the range bump here: a generated project still resolves the
  # newest version inside `^` when it runs `npm install`.
  - package-ecosystem: npm
    directory: "/templates/playwright"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      template-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions used by CI / release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
