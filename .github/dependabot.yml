version: 2
# Every entry waits 7 days (Dependabot's default is 3) after a release before
# proposing it (`cooldown`), so a hijacked version that is caught and
# unpublished within days never reaches a PR. Cooldown applies to version
# updates only — Dependabot security updates still open PRs as soon as a fix
# exists.
updates:
  # Root npm workspace — the single root package-lock.json covers
  # `cli` and `packages/*`, so this one entry keeps the whole workspace current.
  - package-ecosystem: npm
    directory: "/"
    # The published packages pin their runtime dependencies to exact versions
    # (see scripts/runtime-deps.test.mjs). `increase` bumps a pin to the new
    # exact version instead of widening it into a range.
    versioning-strategy: increase
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Batch all minor/patch bumps into one PR to cut review noise.
      # Major bumps stay as individual PRs so breaking changes get human review.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Scaffold template shipped into user projects. It lives outside the
  # workspace and has no lockfile, so Dependabot bumps the package.json
  # ranges directly. Keeps generated projects on recent deps. The cooldown
  # only delays the range bump here: a generated project still resolves the
  # newest version inside `^` when it runs `npm install`.
  - package-ecosystem: npm
    directory: "/templates/playwright"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      template-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Flutter scaffold template (pubspec.yaml, no lockfile shipped), so the
  # constraints that generated projects start from stay current.
  - package-ecosystem: pub
    directory: "/templates/flutter"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # flutter_gherkin (3.0.0-rc.17, the last release) and build_runner (2.4.x,
    # forced by flutter_gherkin's transitive deps) are pinned on purpose; see the
    # comment in templates/flutter/pubspec.yaml. build_runner patches still flow.
    ignore:
      - dependency-name: flutter_gherkin
      - dependency-name: build_runner
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      flutter-template:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions used by CI / release workflows. The scaffolded
  # specproof-drift-check.yml pins the same SHAs; a test keeps them in sync
  # (scripts/dependency-watch.test.mjs), so bump the templates in the same PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
